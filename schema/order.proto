syntax = "proto3";
package osm.order;

// Order lifecycle for the Go logistics API.

message Order {
  string id = 1;
  double pickup_lat = 2;
  double pickup_lon = 3;
  double dropoff_lat = 4;
  double dropoff_lon = 5;
  string status = 6;         // pending | assigned | picked_up | delivered | cancelled
  int32 assigned_driver_id = 7;
  double estimated_distance_m = 8;
  double estimated_duration_seconds = 9;
  double actual_distance_m = 10;
  string created_at = 11;    // ISO 8601
  string updated_at = 12;
}

message CreateOrderRequest {
  double pickup_lat = 1;
  double pickup_lon = 2;
  double dropoff_lat = 3;
  double dropoff_lon = 4;
}

message CreateOrderResponse {
  Order order = 1;
  string error = 2;
}

message ListOrdersRequest {
  string status = 1;         // filter by status, empty = all
  int32 limit = 2;
  int32 offset = 3;
}

message ListOrdersResponse {
  repeated Order orders = 1;
  int32 total = 2;
}

message UpdateOrderStatusRequest {
  string id = 1;
  string new_status = 2;
}

message DispatchRequest {
  string order_id = 1;
}

message DispatchResponse {
  Order order = 1;
  DriverAssignment driver = 2;
  string error = 3;
}

message DriverAssignment {
  int32 driver_id = 1;
  double distance_m = 2;
  double eta_seconds = 3;
}

message StatsResponse {
  int32 drivers_total = 1;
  int32 drivers_available = 2;
  int32 orders_pending = 3;
  int32 orders_assigned = 4;
  int32 orders_delivered = 5;
  int32 orders_total = 6;
}
