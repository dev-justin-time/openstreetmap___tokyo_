[package]
name = "gpx_processor"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
warp = "0.3"
gpx = "0.10"
tokio = { version = "1", features = ["full"] }
prometheus = { version = "0.13", features = ["process"] }
async-stream = "0.3"
rstar = "0.11"
reqwest = { version = "0.11", features = ["json"] }
